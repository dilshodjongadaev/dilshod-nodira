<style>
:root{--bg:#f8f3fb;--bg2:#efe5f6;--ink:#3e3352;--muted:#8a7f9c;--plum:#6d4f97;--lav:#b79bd6;--lilac:#d9c8ec;--pink:#f2b8c6;--rose:#e58ea7;--leaf:#8fa986;--line:#e3d6ef;--paper:#fffdfd;
  --f-ru:'Cormorant Garamond',Georgia,serif;--f-ru-hand:'Caveat',cursive;--f-en:'Great Vibes',cursive;--f-ko:'Gowun Batang',serif;--f-ko-hand:'Nanum Pen Script',cursive;--f-ui:'Manrope',system-ui,sans-serif;
  --f-serif:var(--f-ru);--f-hand:var(--f-ru-hand)}
html[lang=ko]{--f-serif:var(--f-ko);--f-hand:var(--f-ko-hand)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overflow-x:clip}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(90% 60% at 50% 0%,#fff,var(--bg) 60%),linear-gradient(180deg,var(--bg),var(--bg2))}
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petals i{position:absolute;top:-30px;width:11px;height:9px;border-radius:11px 0 11px 0;opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(540deg)}}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 20px 120px}

/* ---- language ---- */
.langs{position:fixed;top:14px;right:14px;z-index:40;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);backdrop-filter:blur(6px)}
.langs button{border:0;background:none;color:var(--muted);font:500 13px var(--f-ui);padding:6px 12px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--plum);color:#fff}

/* ---- intro: they walk in and take hands ---- */
.intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;
  background:radial-gradient(80% 55% at 50% 45%,#fff,var(--bg) 60%,var(--bg2));transition:opacity 1.2s ease,visibility 0s 1.2s}
.intro.gone{opacity:0;visibility:hidden}
.en{font-family:var(--f-en);font-size:30px;color:var(--plum);line-height:1}
.intro .title{font-family:var(--f-hand);font-size:clamp(46px,13vw,64px);line-height:1.05;color:var(--ink)}
.scene{width:min(96vw,420px);height:auto;overflow:visible;margin-top:4px}
.go-heart{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff,#f6d7e1 60%,#eab4c4);box-shadow:0 10px 24px -6px rgba(229,142,167,.7);animation:pulse 1.6s ease-in-out infinite}
.go-heart svg{width:30px;fill:var(--rose)}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 24px -6px rgba(229,142,167,.6)}50%{transform:scale(1.1);box-shadow:0 12px 34px -4px rgba(229,142,167,.9)}}
.stage{position:relative}
.intro.walk .go-heart{opacity:0;transform:scale(.4);transition:.4s;pointer-events:none}
.tapline{font-family:var(--f-serif);font-style:italic;font-size:19px;color:var(--muted);min-height:26px}
html[lang=ko] .tapline{font-style:normal;font-size:17px}
.intro .reveal{font-family:var(--f-hand);font-size:clamp(26px,7.5vw,34px);color:var(--plum);min-height:40px;opacity:0;transition:opacity .9s ease}
.intro.joined .reveal{opacity:1}.intro.walk .tapline{opacity:0;transition:opacity .3s}

.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
.burst{position:absolute;left:50%;top:38%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-5px;top:-5px;font-style:normal;font-size:14px;opacity:0;animation:spark 1.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.1) rotate(40deg)}}

/* ---- sections ---- */
section{min-height:72svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 0;position:relative}
.label{font:500 11px var(--f-ui);letter-spacing:.34em;text-transform:uppercase;color:var(--lav)}
.label b{display:block;margin-top:4px;font:400 26px var(--f-en);letter-spacing:0;text-transform:none;color:var(--plum)}
h2{margin:14px 0 0;font-family:var(--f-serif);font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.2;color:var(--ink)}
html[lang=ko] h2{font-size:clamp(25px,6.6vw,32px);font-weight:700}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.15s}.d2{transition-delay:.3s}.d3{transition-delay:.45s}.d4{transition-delay:.6s}.d5{transition-delay:.75s}
.thin{width:1px;height:46px;margin:18px auto;background:linear-gradient(var(--lav),transparent)}

.hero{min-height:100svh;padding-top:60px}
.hero .date{font:500 12px var(--f-ui);letter-spacing:.4em;color:var(--muted)}
.namebox{position:relative;height:clamp(76px,20vw,100px);width:100%;margin-top:10px}
.namebox span{position:absolute;inset:0;display:grid;place-items:center;white-space:nowrap;font-family:var(--f-hand);font-size:clamp(44px,12.5vw,68px);line-height:1;color:var(--plum);opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease}
html[lang=ko] .namebox span{font-size:clamp(56px,17vw,84px)}
.namebox span.on{opacity:1;transform:none}
.hero p{max-width:330px;margin:10px auto 0;font-family:var(--f-serif);font-size:22px;line-height:1.5;color:var(--ink)}
html[lang=ko] .hero p{font-size:18px;line-height:1.8}
.bouquet{width:min(78vw,300px);height:auto;margin-top:18px;overflow:visible}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:bsway 6s ease-in-out infinite}
@keyframes bsway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.scroll{margin-top:22px;font:500 11px var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
html[lang=ko] .scroll{letter-spacing:.1em;font-size:12px}

.letter{position:relative;margin-top:24px;width:100%;padding:44px 26px 30px;border-radius:4px;text-align:left;background:var(--paper);
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,#efe6f6 33px 34px);background-position:0 18px;box-shadow:0 26px 50px -24px rgba(109,79,151,.45);border:1px solid var(--line)}
.letter .corner{position:absolute;right:-18px;top:-26px;width:110px;height:auto;overflow:visible;pointer-events:none}
.letter .corner.bl{right:auto;top:auto;left:-20px;bottom:-24px;transform:rotate(180deg);width:90px}
.letter .dear{font-family:var(--f-hand);font-size:34px;color:var(--plum);margin-bottom:8px;line-height:1.2}
.letter p{margin:0 0 12px;font-family:var(--f-serif);font-size:20px;line-height:1.7}
html[lang=ko] .letter p{font-size:16.5px;line-height:2.05}
.letter .sig{margin-top:10px;text-align:right;font-family:var(--f-hand);font-size:32px;color:var(--plum)}
.letter .seal{position:absolute;left:50%;top:-24px;margin-left:-24px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:italic 600 14px var(--f-ru);color:#fff;
  background:radial-gradient(circle at 32% 28%,#c9aee6,#8a67b8 60%,#5d4384);box-shadow:0 5px 10px rgba(93,67,132,.4),inset 0 -3px 6px rgba(0,0,0,.2)}

.vows{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:12px;width:100%}
.vows li{display:flex;align-items:center;gap:14px;text-align:left;padding:15px 16px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid var(--line);box-shadow:0 10px 24px -18px rgba(109,79,151,.5)}
.vows .ic{flex:none;width:44px;height:44px}
.vows p{margin:0;font-family:var(--f-serif);font-size:20px;line-height:1.35;color:var(--ink)}
html[lang=ko] .vows p{font-size:16.5px;line-height:1.6}

.dday{margin-top:22px;font:400 64px/1 var(--f-en);color:var(--plum)}
.count{display:flex;gap:8px;margin-top:14px}
.count div{width:72px;padding:12px 0 10px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid var(--line)}
.count b{display:block;font:500 32px var(--f-ru);color:var(--plum);font-variant-numeric:tabular-nums}
.count small{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.when{margin-top:16px;font-family:var(--f-serif);font-size:19px;color:var(--ink)}

.card{position:relative;width:100%;margin-top:26px;padding:38px 24px 30px;border-radius:6px;background:var(--paper);border:1px solid var(--line);box-shadow:0 30px 60px -28px rgba(109,79,151,.55)}
.card::before{content:"";position:absolute;inset:9px;border:1px solid var(--lilac);border-radius:3px;pointer-events:none}
.card .wd{font:400 34px var(--f-en);color:var(--plum)}
.card .big{margin-top:2px;font:500 64px/1 var(--f-ru);letter-spacing:.06em;color:var(--ink)}
.card .meta{margin-top:8px;font:500 11px var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
html[lang=ko] .card .meta{letter-spacing:.12em;font-size:12px}
.card .txt{margin:18px auto 0;max-width:330px;font-family:var(--f-serif);font-size:21px;line-height:1.55}
html[lang=ko] .card .txt{font-size:17px;line-height:1.9}
.card .rc{position:absolute;width:96px;height:auto;overflow:visible;pointer-events:none}
.card .rc.tl{left:-22px;top:-30px}.card .rc.br{right:-22px;bottom:-30px;transform:rotate(180deg)}
.accept{margin-top:22px;height:54px;padding:0 30px;border:0;border-radius:999px;cursor:pointer;color:#fff;font:500 18px var(--f-ui);
  background:linear-gradient(180deg,#9d7cc8,#6d4f97);box-shadow:0 12px 26px -10px rgba(109,79,151,.8);animation:pulse2 2.2s ease-in-out infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.yes .mini{width:150px;height:auto;margin:6px auto 0;display:block;overflow:visible}
.yes .ok{margin-top:6px;font-family:var(--f-hand);font-size:clamp(30px,8.5vw,38px);line-height:1.2;color:var(--plum)}
.yes .note{margin-top:20px;font-family:var(--f-serif);font-size:18px;color:var(--muted)}
.yes textarea{width:100%;margin-top:10px;min-height:110px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font:18px/1.6 var(--f-serif);resize:vertical;
  background-image:repeating-linear-gradient(180deg,transparent 0 28px,#f1e8f7 28px 29px);background-position:0 13px}
html[lang=ko] .yes textarea{font:22px/1.3 var(--f-ko-hand)}
.yes textarea:focus{outline:2px solid var(--lav);outline-offset:1px}
.btn{margin-top:12px;height:48px;padding:0 26px;border:1px solid var(--plum);border-radius:999px;cursor:pointer;background:#fff;color:var(--plum);font:500 16px var(--f-ui)}
.btn:disabled{opacity:.5}
.foot{min-height:60svh}
.foot .with{font-family:var(--f-serif);font-size:21px;color:var(--muted)}
.foot .who{margin-top:6px;font-family:var(--f-hand);font-size:clamp(46px,13vw,62px);color:var(--plum)}
.music{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);color:var(--plum);font:500 14px var(--f-ui);cursor:pointer;box-shadow:0 8px 20px -12px rgba(109,79,151,.6)}
.music[aria-pressed=true]{background:var(--plum);color:#fff}
.toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);z-index:50;padding:12px 20px;border-radius:999px;background:var(--plum);color:#fff;font-size:15px;opacity:0;transition:.4s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.hearts i{position:absolute;bottom:-40px;font-style:normal;animation:up 3.4s ease-in forwards}
@keyframes up{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-110vh) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.petals{display:none}}

/* ===== motion layer ===== */
.prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:35;pointer-events:none}
.prog i{position:absolute;left:0;top:0;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#b79bd6,#e58ea7)}
.prog b{position:absolute;top:-6px;left:0;font-size:12px;color:#e58ea7;transform:translateX(-50%);transition:opacity .3s}
.petals i{border-radius:0;background:none!important;width:auto;height:auto;animation-name:fall2}
.petals i span{display:block;width:12px;height:10px;border-radius:12px 1px 12px 1px;background:var(--c);animation:tumble 3.4s ease-in-out infinite}
.petals i.far{filter:blur(1.2px);opacity:.5}.petals i.near span{width:17px;height:14px}
@keyframes fall2{0%{transform:translate(0,-20px)}100%{transform:translate(var(--dx),108vh)}}
@keyframes tumble{0%{transform:rotateX(0) rotateY(0) rotateZ(0)}50%{transform:rotateX(180deg) rotateY(70deg) rotateZ(120deg)}100%{transform:rotateX(360deg) rotateY(0) rotateZ(240deg)}}
.flyers{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.bf{position:absolute;left:0;top:0;width:34px;height:28px;will-change:transform}
.bf svg{width:100%;height:100%;overflow:visible}
.bf .wl,.bf .wr{transform-box:fill-box;animation:flapL .26s ease-in-out infinite alternate}
.bf .wl{transform-origin:100% 60%}.bf .wr{transform-origin:0 60%;animation-name:flapR}
@keyframes flapL{to{transform:scaleX(.25)}}@keyframes flapR{to{transform:scaleX(.25)}}
.taps{position:fixed;inset:0;z-index:44;pointer-events:none}
.taps i{position:absolute;font-style:normal;font-size:12px;opacity:0;animation:tapb .9s ease-out forwards}
@keyframes tapb{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(25deg)}}
/* reveals */
.wipe{display:inline-block;padding:0 .12em;clip-path:inset(0 100% 0 0);transition:clip-path 1.6s cubic-bezier(.6,.1,.2,1) .2s}
.in .wipe,.wipe.in{clip-path:inset(0 -10% 0 0)}
.label{position:relative;display:inline-block}
.label::before,.label::after{content:"";position:absolute;top:7px;width:38px;height:1px;background:var(--lav);transform:scaleX(0);transition:transform 1s ease .4s}
.label::before{right:calc(100% + 12px);transform-origin:100% 50%}.label::after{left:calc(100% + 12px);transform-origin:0 50%}
.label.in::before,.label.in::after{transform:scaleX(1)}
.words .w{display:inline-block;opacity:0;transform:translateY(10px);filter:blur(4px);transition:opacity .7s ease,transform .7s ease,filter .7s ease}
.words.in .w{opacity:1;transform:none;filter:none}
#heroDate span{display:inline-block;opacity:0;transform:translateY(-8px);transition:opacity .5s ease,transform .5s ease}
#heroDate.in span{opacity:1;transform:none}
.namebox span{filter:blur(6px);letter-spacing:.06em;transition:opacity 1s ease,transform 1s ease,filter 1s ease,letter-spacing 1.4s ease}
.namebox span.on{filter:none;letter-spacing:0}
/* bouquet blooms, stems grow */
.bloom .stem{stroke-dasharray:80;stroke-dashoffset:80;transition:stroke-dashoffset 1.4s ease}
.bloom.in .stem{stroke-dashoffset:0}
.bloom .fl{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0) rotate(-40deg)}
.bloom.in .fl{animation:flo .9s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes flo{to{transform:scale(1) rotate(0)}}
.bloom .wrap{opacity:0;transform:translateY(14px);transition:opacity .8s ease 1s,transform .8s ease 1s}.bloom.in .wrap{opacity:1;transform:none}
/* letter: envelope opens, folded paper slides out, then unfolds */
.envwrap{position:relative;width:100%;margin-top:28px;transform:none!important;opacity:1!important}
.envstack{position:absolute;left:50%;top:10px;width:min(100%,330px);height:200px;transform:translateX(-50%);z-index:5;pointer-events:none;transition:transform 1s cubic-bezier(.5,0,.3,1) 2.3s,opacity .7s ease 2.6s}
.envstack svg,.envstack .es-paper{position:absolute;left:0;width:100%}
.es-back{top:0;height:100%;z-index:0;filter:drop-shadow(0 18px 24px rgba(109,79,151,.28))}
.es-front{top:0;height:100%;z-index:3}
.es-flap{top:0;height:72%;z-index:4;transform-origin:50% 0;transition:transform .8s cubic-bezier(.4,0,.2,1) .55s,z-index 0s linear .95s}
.es-paper{left:7%!important;width:86%!important;top:14px;height:170px;z-index:1;border-radius:3px;background:#fffdfd;box-shadow:0 2px 8px rgba(109,79,151,.15);padding:26px 18px;display:flex;flex-direction:column;gap:14px;opacity:0;
  transition:opacity .3s ease 1s,transform 1.1s cubic-bezier(.3,.8,.2,1) 1.2s}
.es-paper span{display:block;height:3px;border-radius:2px;background:#e8dcf3}.es-paper span:nth-child(1){width:55%;background:#cbb3e6}.es-paper span:nth-child(4){width:70%}
.es-seal{position:absolute;left:50%;top:72%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:6;border-radius:50%;display:grid;place-items:center;font:italic 600 13px var(--f-ru);color:#fff;
  background:radial-gradient(circle at 32% 28%,#c9aee6,#8a67b8 60%,#5d4384);box-shadow:0 5px 10px rgba(93,67,132,.4);transition:transform .45s cubic-bezier(.5,0,.6,1.4) .15s,opacity .35s ease .3s}
.envwrap.in .es-seal{transform:scale(1.25);opacity:0}
.envwrap.in .es-flap{transform:rotateX(180deg);z-index:0}
.envwrap.in .es-paper{opacity:1;transform:translateY(-118px)}
.envwrap.in .envstack{transform:translate(-50%,90px);opacity:0}
.envwrap .letter{margin-top:0;z-index:1;opacity:0;transform:scaleY(.18);transform-origin:50% 0;transition:opacity .5s ease 2.6s,transform 1.1s cubic-bezier(.3,.8,.2,1) 2.6s}
.envwrap.in .letter{opacity:1;transform:none}
.envwrap:not(.in){min-height:240px}
.letter p,.letter .dear{opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease}
.envwrap.in .letter .dear{opacity:1;transform:none;transition-delay:3.5s}
.envwrap.in .letter p{opacity:1;transform:none}
.envwrap.in .letter p:nth-child(1){transition-delay:3.9s}.envwrap.in .letter p:nth-child(2){transition-delay:4.4s}.envwrap.in .letter p:nth-child(3){transition-delay:4.9s}
.envwrap .sig.wipe{transition-delay:5.5s}
.letter .seal{transform:scale(1.8) rotate(-30deg);opacity:0}
.envwrap.in .letter .seal{animation:stamp .5s cubic-bezier(.5,0,.6,1.4) 6.6s forwards}
@keyframes stamp{0%{transform:scale(1.8) rotate(-30deg);opacity:0}70%{transform:scale(.92) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.letter .corner{transform:scale(0);transform-origin:70% 60%}
.envwrap.in .letter .corner{animation:flo 1s cubic-bezier(.3,1.6,.5,1) 3.6s forwards}
/* vows */
.vows li{opacity:0;transform:translateX(-40px) rotate(-2deg);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.vows li:nth-child(2n){transform:translateX(40px) rotate(2deg)}
.vows li.in{opacity:1;transform:none}
.vows li .ic{transform:scale(0) rotate(-60deg);transition:transform .8s cubic-bezier(.3,1.6,.5,1) .45s}
.vows li.in .ic{transform:none}

const mtof=m=>440*Math.pow(2,(m-69)/12);
function pianoTone(f,t,dur,vol){const a=Music.ac,gn=a.createGain();gn.connect(Music.bus);
  [[1,1],[2,.32],[3,.1],[4.02,.04]].forEach(([m,v])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f*m;g.gain.value=v;o.connect(g).connect(gn);o.start(t);o.stop(t+dur+.1)});
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.01);gn.gain.exponentialRampToValueAtTime(vol*.35,t+.35);gn.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function padTone(f,t,dur,vol){const a=Music.ac,o=a.createOscillator(),o2=a.createOscillator(),lp=a.createBiquadFilter(),gn=a.createGain();
  o.type='triangle';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*1.004;lp.type='lowpass';lp.frequency.value=1100;
  o.connect(lp);o2.connect(lp);lp.connect(gn);gn.connect(Music.bus);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+dur*.35);gn.gain.linearRampToValueAtTime(vol*.8,t+dur*.8);gn.gain.linearRampToValueAtTime(0,t+dur+.25);
  o.start(t);o2.start(t);o.stop(t+dur+.3);o2.stop(t+dur+.3)}
function phrase(t0){const beat=.85,k=Music.k=(Music.k||0)+1;
  const BASS=[50,45,47,42,43,38,43,45],CH=[[62,66,69],[61,64,69],[62,66,71],[61,66,69],[62,67,71],[62,66,69],[62,67,71],[61,64,69]];
  const V=[[[78,2],[76,2],[74,2],[73,2],[71,2],[69,2],[71,2],[73,2]],[[74,2],[73,2],[71,2],[69,2],[67,2],[66,2],[67,2],[64,2]],[74,78,81,79,78,74,78,76,74,71,74,81,79,83,81,79].map(n=>[n,1])];
  BASS.forEach((n,i)=>{const t=t0+i*2*beat;pianoTone(mtof(n),t,2*beat*1.5,.34);pianoTone(mtof(n-12),t,2*beat*1.5,.12);CH[i].forEach(m=>padTone(mtof(m),t,2*beat,.045))});
  const play=(mel,vol)=>{let at=0;mel.forEach(([n,d])=>{pianoTone(mtof(n),t0+at*beat,Math.min(3.6,d*beat*1.7),vol);at+=d})};
  if(k>=2)play(V[(k-2)%3],.3);if(k>=3)play(V[(k-3)%3],.2);return 16*beat}
function loop(){if(!Music.on)return;const len=phrase(Music.ac.currentTime+.08);Music.timer=setTimeout(loop,len*1000-60)}
const TRACKS=['vivaldi-winter.mp3',
  'https://upload.wikimedia.org/wikipedia/commons/transcoded/b/b1/11_-_Vivaldi_Winter_mvt_2_Largo_-_John_Harrison_violin.ogg/11_-_Vivaldi_Winter_mvt_2_Largo_-_John_Harrison_violin.ogg.mp3',
  'https://upload.wikimedia.org/wikipedia/commons/b/b1/11_-_Vivaldi_Winter_mvt_2_Largo_-_John_Harrison_violin.ogg',
  'https://upload.wikimedia.org/wikipedia/commons/transcoded/6/61/Vivaldi_-_Four_Seasons_4_Winter_mvt_2_Largo_-_John_Harrison_violin.oga/Vivaldi_-_Four_Seasons_4_Winter_mvt_2_Largo_-_John_Harrison_violin.oga.mp3'];
const Track={el:null,i:0,ok:false,fade:0};
function trackPlay(){return new Promise(res=>{if(!Track.el){Track.el=new Audio();Track.el.loop=true;Track.el.preload='auto';Track.el.volume=0}
  const a=Track.el;const tryNext=()=>{if(Track.i>=TRACKS.length){res(false);return}a.src=TRACKS[Track.i];a.load();a.play().then(()=>{Track.ok=true;res(true)}).catch(()=>{Track.i++;tryNext()})};
  a.onerror=()=>{if(Track.ok)return;Track.i++;tryNext()};
  if(Track.ok){a.play().then(()=>res(true)).catch(()=>res(false))}else tryNext()})}
function trackFade(to){const a=Track.el;if(!a)return;clearInterval(Track.fade);Track.fade=setInterval(()=>{const v=a.volume+(to>a.volume?.04:-.06);a.volume=Math.max(0,Math.min(1,v));if(Math.abs(a.volume-to)<.06){a.volume=to;clearInterval(Track.fade);if(!to)a.pause()}},60)}
let useSynth=false;
async function toggleMusicReal(force){const want=force===undefined?!Music.on:force;const b=$('#music');
  if(!useSynth){if(want){Music.on=true;b.setAttribute('aria-pressed',true);const ok=await trackPlay();if(ok){trackFade(.6);return}useSynth=true;Music.on=false}
    else{Music.on=false;b.setAttribute('aria-pressed',false);trackFade(0);return}}
  toggleMusicSynth(want)}
function toggleMusicSynth(force){const want=force===undefined?!Music.on:force;const b=$('#music');
  try{if(want){if(!Music.ac){const A=window.AudioContext||window.webkitAudioContext;Music.ac=new A();Music.master=Music.ac.createGain();Music.master.connect(Music.ac.destination);
      Music.bus=Music.ac.createGain();const d=Music.ac.createDelay(),fb=Music.ac.createGain();d.delayTime.value=.31;fb.gain.value=.28;Music.bus.connect(Music.master);Music.bus.connect(d);d.connect(fb).connect(d);d.connect(Music.master)}
    Music.ac.resume();const t=Music.ac.currentTime;Music.master.gain.cancelScheduledValues(t);Music.master.gain.setValueAtTime(0,t);Music.master.gain.linearRampToValueAtTime(Music.VOL,t+1.5);
    Music.on=true;Music.k=0;loop()}
  else if(Music.ac){Music.on=false;clearTimeout(Music.timer);const t=Music.ac.currentTime;Music.master.gain.cancelScheduledValues(t);Music.master.gain.setValueAtTime(Music.master.gain.value,t);Music.master.gain.linearRampToValueAtTime(0,t+.6)}}
  catch(e){}b.setAttribute('aria-pressed',Music.on)}
const toggleMusic=toggleMusicReal;$('#music').onclick=()=>toggleMusic();

drawCorners();drawBouquet();render();
</script>
